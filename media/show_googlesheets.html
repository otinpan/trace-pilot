<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      style-src {{cspSource}} 'unsafe-inline';
      script-src 'nonce-{{nonce}}';
    ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace-Pilot Google Sheets</title>
  <style>
    :root{
      --bg: #eef7ff;
      --panel: rgba(255,255,255,0.82);
      --border: rgba(74,122,173,0.18);
      --grid: #c7ddf4;
      --text: #17324d;
      --sub: #56799d;
      --accent: #3399ff;
      --accent-soft: rgba(153,204,255,0.22);
      --selection: rgba(153,204,255,0.35);
      --selection-border: rgba(51,122,204,0.75);
      --header: #dff0ff;
    }
    html, body{
      height: 100%;
    }
    body{
      margin: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background:
        radial-gradient(circle at top left, rgba(153,204,255,0.38), transparent 30%),
        radial-gradient(circle at right top, rgba(102,170,255,0.18), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: "Aptos", "Segoe UI", sans-serif;
    }
    .bar{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
    }
    .title{
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .sheet-name{
      font-size: 16px;
      font-weight: 700;
    }
    .meta{
      display: flex;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
      color: var(--sub);
      font-size: 12px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .sheet-wrap{
      overflow: auto;
      padding: 16px;
    }
    table{
      border-collapse: separate;
      border-spacing: 0;
      min-width: 100%;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--grid);
      box-shadow: 0 10px 30px rgba(51,102,153,0.10);
    }
    th, td{
      border-right: 1px solid var(--grid);
      border-bottom: 1px solid var(--grid);
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1.4;
      min-width: 80px;
      max-width: 240px;
      white-space: pre-wrap;
      word-break: break-word;
      vertical-align: top;
    }
    thead th{
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--header);
      text-align: center;
      font-weight: 700;
    }
    .row-header{
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--header);
      text-align: right;
      font-weight: 700;
      min-width: 48px;
    }
    thead .corner{
      left: 0;
      z-index: 4;
    }
    td.selected{
      background: var(--selection);
    }
    td.selection-start{
      outline: 2px solid var(--selection-border);
      outline-offset: -2px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.85);
    }
    .empty{
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--sub);
    }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <div class="title">Google Sheets {{hashShort}}</div>
      <div id="sheet-name" class="sheet-name">Loading...</div>
    </div>
  </div>
  <div id="meta" class="meta"></div>
  <div id="sheet-wrap" class="sheet-wrap">
    <div id="sheet-root" class="empty">Loading sheet...</div>
  </div>

  <textarea id="tp-gs-selected" style="display:none">{{selectedJson}}</textarea>
  <textarea id="tp-gs-snapshot" style="display:none">{{snapshotJson}}</textarea>

  <script nonce="{{nonce}}" src="{{showGoogleSheetsJsUri}}"></script>
</body>
</html>
