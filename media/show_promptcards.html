<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        img-src {{cspSource}} https: data:;
        style-src {{cspSource}} 'unsafe-inline';
        script-src 'nonce-{{nonce}}';
      ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace-Pilot PromptCards</title>
  </head>
  <body>
    <h1>Prompt Cards (Debug)</h1>
    <h2>pairHash</h2>
    <pre>{{pairHash}}</pre>
    <h2>times</h2>
    <pre>{{timesText}}</pre>
    <h2>timesToHash</h2>
    <pre>{{timesToHashText}}</pre>
    <h2>hashToPromptMetadata</h2>
    <pre>{{hashToPromptMetadataText}}</pre>
    <script nonce="{{nonce}}" src="{{promptCardsJsUri}}"></script>
  </body>
</html>
