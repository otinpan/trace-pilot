<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      img-src {{cspSource}} https: data: blob:;
      style-src {{cspSource}} 'unsafe-inline';
      script-src 'nonce-{{nonce}}';
      frame-src {{cspSource}} data: blob:;
    ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace-Pilot MHTML</title>
  <style>
    :root{
      --bg: #0a0f14;
      --panel: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.18);
      --text: #e8f2fb;
      --sub: #9fb7ca;
      --accent: #69b1ff;
    }
    html, body{
      height: 100%;
    }
    body{
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background:
        radial-gradient(circle at 20% 0%, rgba(105,177,255,0.14), transparent 45%),
        radial-gradient(circle at 100% 20%, rgba(120,255,220,0.08), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Gill Sans", "Century Gothic", sans-serif;
    }
    .bar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .title{
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .4px;
      font-size: 12px;
      text-transform: uppercase;
    }
    .status{
      color: var(--sub);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #frame{
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="title">MHTML {{hashShort}}</div>
    <div id="status" class="status">Loading...</div>
  </div>
  <iframe id="frame" sandbox="allow-same-origin"></iframe>
  <textarea id="tp-mhtml-html" style="display:none">{{mhtmlHtml}}</textarea>

  <script nonce="{{nonce}}" src="{{showMhtmlJsUri}}"></script>
</body>
</html>
