<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      img-src {{cspSource}} https: data:;
      style-src {{cspSource}} 'unsafe-inline';
      script-src 'nonce-{{nonce}}';
    ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace-Pilot Markdown</title>

  <style>
    body { padding: 16px; line-height: 1.7; }
    .section { margin-bottom: 18px; padding: 12px; border: 1px solid rgba(127,127,127,0.3); border-radius: 10px; }
    .title { font-weight: 700; margin-bottom: 10px; opacity: 0.85; }
    pre { padding: 12px; overflow: auto; border-radius: 8px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    mark.tp-hit { background: rgba(255, 230, 0, 0.35); border: 1px solid rgba(255, 230, 0, 0.8); padding: 0 2px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="section">
    <div class="title">Prompt</div>
    <div id="prompt"></div>
  </div>

  <div class="section">
    <div class="title">Generated</div>
    <div id="generated"></div>
  </div>

  <textarea id="tp-prompt" style="display:none">{{promptText}}</textarea>
  <textarea id="tp-generated" style="display:none">{{generatedText}}</textarea>

  <script nonce="{{nonce}}" src="{{markdownItUri}}"></script>
  <script nonce="{{nonce}}" src="{{showMarkdownJsUri}}"></script>


  <script nonce="{{nonce}}" src="{{markdownItUri}}"></script>
  <script nonce="{{nonce}}" src="{{showMarkdownJsUri}}"></script>
</body>
</html>
