<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      img-src {{cspSource}} https: data:;
      style-src {{cspSource}} 'unsafe-inline';
      script-src 'nonce-{{nonce}}';
    ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace-Pilot Markdown</title>

  <style>
    :root{
      --bg: #000000;
      --text-main: #eef6fb;
      --text-sub: #b5ccd9;
      --card-bg: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.24);
      --card-hover: rgba(255,255,255,0.36);
      --accent: #4da3ff;
      --accent-soft: rgba(77,163,255,0.28);
      --code-bg: rgba(9,20,30,0.65);
    }
    body {
      margin: 0;
      padding: 20px;
      line-height: 1.7;
      color: var(--text-main);
      font-family: "Trebuchet MS", "Gill Sans", "Century Gothic", sans-serif;
      background: var(--bg);
      min-height: 100vh;
    }
    .section {
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--card-bg), rgba(255,255,255,0.02));
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .section:hover{
      border-color: var(--card-hover);
      box-shadow: 0 16px 30px rgba(0,0,0,0.28);
    }
    .title {
      font-weight: 700;
      margin-bottom: 10px;
      color: #9fd0ff;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-size: 12px;
    }
    pre {
      padding: 12px;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: var(--code-bg);
    }
    code {
      font-family: Consolas, "Courier New", monospace;
    }
    :not(pre) > code{
      background: rgba(77,163,255,0.18);
      border: 1px solid rgba(77,163,255,0.38);
      border-radius: 6px;
      padding: 1px 5px;
    }
    mark.tp-hit {
      background: rgba(77, 163, 255, 0.28);
      border: 1px solid rgba(77, 163, 255, 0.75);
      padding: 0 2px;
      border-radius: 4px;
    }
    a{
      color: #86c1ff;
    }
    hr{
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.16);
    }
    .context-pair {
      margin-top: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      background: rgba(255,255,255,0.035);
      overflow: hidden;
    }
    .context-pair-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text-main);
    }
    .context-pair-summary:hover {
      background: rgba(255,255,255,0.05);
    }
    .context-pair-title {
      font-weight: 700;
      color: #c9e5ff;
    }
    .context-pair-meta {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-sub);
      font-size: 12px;
    }
    .context-pair-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .context-message {
      min-width: 0;
      padding-top: 10px;
    }
    .context-message-title,
    .context-codeblocks-summary,
    .context-codeblock-title {
      color: #9fd0ff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .context-message-content {
      max-height: 280px;
      overflow: auto;
      margin-top: 6px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
    }
    .context-message-content > :first-child {
      margin-top: 0;
    }
    .context-message-content > :last-child {
      margin-bottom: 0;
    }
    .context-codeblocks {
      margin-top: 4px;
    }
    .context-codeblocks-summary {
      cursor: pointer;
      padding: 8px 0;
    }
    .context-codeblock {
      margin-top: 8px;
    }
    .context-codeblock pre {
      margin-top: 6px;
      max-height: 260px;
    }
    @media (max-width: 700px){
      body{
        padding: 14px;
      }
      .context-pair-summary {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }
      .context-pair-meta {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="title">Prompt</div>
    <div id="prompt"></div>
  </div>

  <div class="section">
    <div class="title">Generated</div>
    <div id="generated"></div>
  </div>

  <div class="section" id="context-section" style="display:none">
    <div class="title">Previous Conversation</div>
    <div id="context-thread-pairs"></div>
  </div>

  <textarea id="tp-prompt" style="display:none">{{promptText}}</textarea>
  <textarea id="tp-generated" style="display:none">{{generatedText}}</textarea>
  <textarea id="tp-context-thread-pairs" style="display:none">{{contextThreadPairsText}}</textarea>

  <script nonce="{{nonce}}" src="{{markdownItUri}}"></script>
  <script nonce="{{nonce}}" src="{{showMarkdownJsUri}}"></script>
</body>
</html>
